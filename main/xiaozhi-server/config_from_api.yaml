# If you only want a lightweight installation of xiaozhi-server and only use the local configuration file, you do not need to care about this file or modify anything in it.
# If you want to obtain configuration from manager-api, please read below:
# Copy this file to the xiaozhi-server/data directory. If there is no data directory, please create one, and name the copied file .config.yaml
# Note: If there is already a .config.yaml file in the data directory, please delete it first.
# First, start manager-api and manager-web, and register an account. The first registered account will be the administrator.
# As the administrator, go to the [Parameter Management] page, find [server.secret], and copy its value. Note: Every time you deploy from scratch, server.secret will change.
# Open the .config.yaml file in the data directory and set manager-api.secret to the server.secret value you just copied.
server:
  ip: 0.0.0.0
  port: 8000
  # HTTP service port, used for vision analysis interface
  http_port: 8003
  # Vision analysis interface address
  # Interface address for sending vision analysis to the device
  # By default, the system will automatically generate the vision recognition address and output it in the startup log. You can directly use a browser to access and confirm this address.
  # When deploying with Docker or on the public network (using SSL/domain), this may not be accurate
  # So if you use Docker deployment, set vision_explain to the LAN address
  # If you use public network deployment, set vision_explain to the public address
  vision_explain: http://your_ip_or_domain:port/mcp/vision/explain
manager-api:
  # Your manager-api address, preferably use LAN IP
  # If using Docker deployment, please set it to http://xiaozhi-esp32-server-web:8002/xiaozhi
  url: http://127.0.0.1:8002/xiaozhi
  # Your manager-api token, which is the server.secret you just copied
  secret: your_server.secret_value
# Default system prompt template file
prompt_template: agent-base-prompt.txt