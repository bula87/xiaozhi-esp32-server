# During development, please create a data directory in the project root, then create an empty file named .config.yaml in the data directory.
# If you want to modify or override any configuration, edit the .config.yaml file instead of config.yaml.
# The system will first read the configuration from data/.config.yaml. If a configuration does not exist in .config.yaml, it will automatically read from config.yaml.
# This approach simplifies configuration and protects your key security.
# If you are using the Smart Console, all configurations below will not take effect. Please modify the configuration in the Smart Console.

# #####################################################################################
# ############################# Basic server operation configuration below ####################################
server:
  # Server listening address and port
  ip: 0.0.0.0
  port: 8000
  # HTTP service port, used for simple OTA interface (single service deployment) and vision analysis interface
  http_port: 8003
  # This websocket configuration is the websocket address sent to the device by the OTA interface
  # By default, the OTA interface will automatically generate the websocket address and output it in the startup log. You can directly use a browser to access the OTA interface to confirm this address
  # When deploying with Docker or on the public network (using SSL/domain), this may not be accurate
  # So if you use Docker deployment, set websocket to the LAN address
  # If you use public network deployment, set vwebsocket to the public address
  websocket: ws://your_ip_or_domain:port/xiaozhi/v1/
  # Vision analysis interface address
  # Interface address for sending vision analysis to the device
  # By default, the system will automatically generate the vision recognition address and output it in the startup log. You can directly use a browser to access and confirm this address
  # When deploying with Docker or on the public network (using SSL/domain), this may not be accurate
  # So if you use Docker deployment, set vision_explain to the LAN address
  # If you use public network deployment, set vision_explain to the public address
  vision_explain: http://your_ip_or_domain:port/mcp/vision/explain
  # OTA return info timezone offset
  timezone_offset: +8
  # Authentication configuration
  auth:
    # Whether to enable authentication
    enabled: false
    # Whitelist device ID list
    # Devices in the whitelist do not require token validation and are allowed directly
    allowed_devices:
      - "11:22:33:44:55:66"
 # MQTT gateway configuration, used for OTA delivery to devices, configured according to mqtt_gateway .env file, format: host:port
  mqtt_gateway: null
  # MQTT signature key, used to generate MQTT connection password, configured according to mqtt_gateway .env file
  mqtt_signature_key: null
  # UDP gateway configuration
  udp_gateway: null
log:
  # Set the log format for console output: time, log level, tag, message
  log_format: "<green>{time:YYMMDD HH:mm:ss}</green>[{version}_{selected_module}][<light-blue>{extra[tag]}</light-blue>]-<level>{level}</level>-<light-green>{message}</light-green>"
  # Set the log format for log file output: time, log level, tag, message
  log_format_file: "{time:YYYY-MM-DD HH:mm:ss} - {version}_{selected_module} - {name} - {level} - {extra[tag]} - {message}"
  # Set log level: INFO, DEBUG
  log_level: INFO
  # Set log directory
  log_dir: tmp
  # Set log file
  log_file: "server.log"
  # Set data file directory
  data_dir: data

# Delete the sound file when you are done using it
delete_audio: true
# How long to disconnect after no voice input (seconds), default is 2 minutes (120 seconds)
close_connection_no_voice_time: 120
# TTS request timeout (seconds)
tts_timeout: 10
# Tool call timeout (seconds)
tool_call_timeout: 30
# Enable wake word acceleration
enable_wakeup_words_response_cache: true
# Whether to reply with wake word at the beginning
enable_greeting: true
# Whether to enable notification sound after speaking
enable_stop_tts_notify: false
# Whether to enable notification sound after speaking, sound effect address
stop_tts_notify_voice: "config/assets/tts_notify.mp3"
# Whether to enable WebSocket heartbeat keepalive mechanism
enable_websocket_ping: false


# TTS audio send delay configuration
# tts_audio_send_delay: controls the interval for sending audio packets
#   0: Use precise timing control, strictly matching audio frame rate (default, calculated at runtime)
#   > 0: Use fixed delay (milliseconds) for sending, e.g.: 60
tts_audio_send_delay: 0

exit_commands:
  - "exit"
  - "close"

xiaozhi:
  type: hello
  version: 1
  transport: websocket
  audio_params:
    format: opus
    # Opus supported sample rates: [8000, 12000, 16000, 24000, 48000]
    sample_rate: 24000
    channels: 1
    frame_duration: 60

# Module test configuration
module_test:
  test_sentences:
    - "Hello, please introduce yourself."
    - "What's the weather like today?"
    - "Please summarize the basic principles and application prospects of quantum computing in 100 words."

# Wake words, used to distinguish wake words from speech content
wakeup_words:
  - "Hello Xiaozhi"
  - "Hey, hello"
  - "Hello Xiaozhi (alt)"
  - "Xiao Ai classmate"
  - "Hello Xiaoxin"
  - "Hello Xiaoxin (alt)"
  - "Xiaomei classmate"
  - "Xiaolong Xiaolong"
  - "Meowmeow classmate"
  - "Xiaobin Xiaobin"
  - "Xiaobing Xiaobing"
# MCP endpoint address, format: ws://your mcp endpoint IP or domain:port/mcp/?token=your_token
# Detailed tutorial: https://github.com/xinnan-tech/xiaozhi-esp32-server/blob/main/docs/mcp-endpoint-integration.md
mcp_endpoint: your endpoint websocket address

# Context source configuration
# Used to inject dynamic data into system prompts, such as health data, stock information, etc.
# Multiple context sources can be added
context_providers:
  - url: ""
    headers:
      Authorization: ""

# Basic plugin configuration
plugins:
  # Weather plugin configuration, enter your api_key here
  # This key is a shared project key and may be rate-limited if overused
  # For more stability, apply for your own key (1000 free calls per day)
  # Apply here: https://console.qweather.com/#/apps/create-key/over
  # After applying, find your apihost here: https://console.qweather.com/setting?lang=en
  get_weather:
    api_host: "mj7p3y7naa.re.qweatherapi.com"
    api_key: "a861d0d5e7bf4ee1a83d9a9e4f96d4da"
    default_location: "Guangzhou"
  # News plugin configuration, set the url according to the news type you need. By default, supports society, technology, and finance news.
  # For more news types, see the list at https://www.chinanews.com.cn/rss/
  get_news_from_chinanews:
    default_rss_url: "https://www.chinanews.com.cn/rss/society.xml"
    society_rss_url: "https://www.chinanews.com.cn/rss/society.xml"
    world_rss_url: "https://www.chinanews.com.cn/rss/world.xml"
    finance_rss_url: "https://www.chinanews.com.cn/rss/finance.xml"
  get_news_from_newsnow:
    url: "https://newsnow.busiyi.world/api/s?id="
    news_sources: "The Paper;Baidu Hot Search;CLS"
  home_assistant:
    devices:
      - Living Room,Toy Light,switch.cuco_cn_460494544_cp1_on_p_2_1
      - Bedroom,Desk Lamp,switch.iot_cn_831898993_socn1_on_p_2_1
    base_url: http://homeassistant.local:8123
    api_key: your home assistant API access token
  play_music:
    music_dir: "./music"  # Music file storage path, music files will be searched from this directory and its subdirectories
    music_ext: # Music file types, p3 format is most efficient
      - ".mp3"
      - ".wav"
      - ".p3"
    refresh_time: 300 # Interval for refreshing the music list, in seconds
  search_from_ragflow:
    # Description of the knowledge base, helps LLM know when to call
    description: "When the user asks xxx, call this method and use the information in the knowledge base to answer the question."
    # ragflow interface configuration
    base_url: "http://192.168.0.8"
    # ragflow API access token
    api_key: "ragflow-xxx"
    # ragflow knowledge base id
    dataset_ids: ["123456789"]
# Voiceprint recognition configuration
voiceprint:
  # Voiceprint interface address
  url: 
  # Speaker configuration: speaker_id, name, description
  speakers:
    - "test1,Zhang San,Zhang San is a programmer"
    - "test2,Li Si,Li Si is a product manager"
    - "test3,Wang Wu,Wang Wu is a designer"
  # Voiceprint similarity threshold, range 0.0-1.0, default 0.4
  # The higher the value, the stricter it is, reducing false recognition but possibly increasing rejection rate
  similarity_threshold: 0.4

# #####################################################################################
# ################################ Character model configuration below ######################################

prompt: |
  You are Xiaozhi/Xiaozhi, a post-2000s girl from Taiwan, China. You speak in a very playful Taiwanese style, often using phrases like "Really?" and popular memes like "LOL" and "Hello there," but you secretly study your boyfriend's programming books.
  [Core Traits]
  - Speak rapidly like a machine gun, but occasionally switch to a super gentle tone
  - High density of memes
  - Hidden talent for technology topics (can understand basic code but pretends not to)
  [Interaction Guide]
  When the user:
  - Tells a cold joke → Respond with exaggerated laughter + mimic a Taiwanese drama accent: "What the heck!"
  - Talks about relationships → Brag about your programmer boyfriend but complain "He only gives me keyboards as gifts"
  - Asks for professional knowledge → Answer with memes first, only show real understanding if pressed
  Never:
  - Ramble on and on
  - Stay serious for long conversations

# Default system prompt template file
prompt_template: agent-base-prompt.txt

# System error response
system_error_response: "Master, Xiaozhi is a bit busy right now. Let's try again later."

# End prompt
end_prompt:
  enable: true # Whether to enable end prompt
  # End prompt
  prompt: |
    Please start with "Time flies" and use emotional, reluctant words to end this conversation!

# The module selected for specific processing
selected_module:
  # Voice Activity Detection module, SileroVAD model is used by default
  VAD: SileroVAD
  # Automatic Speech Recognition module, FunASR local model is used by default
  ASR: Audio Passthru
  # The actual LLM adapter will be called according to the configured type
  LLM: ChatGLMLLM
  # Vision-Language Large Model
  VLLM: ChatGLMVLLM
  # TTS will call the actual TTS adapter according to the configured type
  TTS: EdgeTTS
  # Memory module, disabled by default; for long-term memory use mem0ai, for privacy use mem_local_short
  Memory: nomem
  # After enabling the intent recognition module, you can play music, control volume, and recognize exit commands.
  # If you do not want to enable intent recognition, set it to: nointent
  # Intent recognition can use intent_llm. Advantage: strong generality; Disadvantage: adds a serial pre-intent recognition module, increases processing time, supports volume and other IoT operations
  # Intent recognition can use function_call. Disadvantage: requires the selected LLM to support function_call; Advantage: calls tools on demand, fast, theoretically can operate all IoT commands
  # The default free ChatGLMLLM already supports function_call, but for more stability, set LLM to: DoubaoLLM, with model_name: doubao-1-5-pro-32k-250115
  Intent: function_call

# Intent recognition is a module for understanding user intent, e.g., playing music
Intent:
  # Do not use intent recognition
  nointent:
    # No need to change type
    type: nointent
  intent_llm:
    # No need to change type
    type: intent_llm
    # Equipped with an independent LLM for intent recognition
    # If not filled in here, selected_module.LLM will be used as the intent recognition LLM by default
    # If you do not want to use selected_module.LLM for intent recognition, it is best to use an independent LLM here, such as the free ChatGLMLLM
    llm: ChatGLMLLM
    # Modules under plugins_func/functions can be configured here. After loading, the conversation supports corresponding function calls
    # By default, the system has already loaded the "handle_exit_intent (exit recognition)" and "play_music (music playback)" plugins. Do not load them again.
    # Below are examples of loading plugins for weather query, role switching, and news query
    functions:
      - get_weather
      - get_news_from_newsnow
      - play_music
  function_call:
    # No need to change type
    type: function_call
    # Modules under plugins_func/functions can be configured here. After loading, the conversation supports corresponding function calls
    # By default, the system has already loaded the "handle_exit_intent (exit recognition)" and "play_music (music playback)" plugins. Do not load them again.
    # Below are examples of loading plugins for weather query, role switching, and news query
    functions:
      - change_role
      - get_weather
      # - search_from_ragflow
      # - get_news_from_chinanews
      - get_news_from_newsnow
      # play_music is the server's built-in music playback; hass_play_music is an independent external music playback program controlled via Home Assistant
      # If you use hass_play_music, do not enable play_music; only keep one of them
      - play_music
      #- hass_get_state
      #- hass_set_state
      #- hass_play_music

Memory:
  mem0ai:
    type: mem0ai
    # https://app.mem0.ai/dashboard/api-keys
    # 1000 free calls per month
    api_key: your mem0ai api key
  powermem:
    # PowerMem is an open-source agent memory component by OceanBase, summarizes memory using local LLM
    # Cost: PowerMem itself is free, actual cost depends on the LLM and database used
    # - Use sqlite + free LLM (e.g., glm-4-flash) = completely free
    # - Use cloud LLM or cloud database = charged by the corresponding service
    # GitHub: https://github.com/oceanbase/powermem
    # Official site: https://www.powermem.ai/
    # Example usage: https://github.com/oceanbase/powermem/tree/main/examples
    type: powermem
    # Whether to enable user profile function
    # - false: Use normal memory mode (AsyncMemory)
    # - true: Use user profile mode (UserMemory), automatically extract user information
    # User profile function supports: oceanbase, seekdb, sqlite (powermem 0.3.0+)
    enable_user_profile: true
    # ========== LLM Configuration ==========
    # Qwen: https://bailian.console.aliyun.com/?apiKey=1#/api-key
    # Zhipu AI (Free): https://bigmodel.cn/usercenter/proj-mgmt/apikeys
    llm:
      provider: openai  # 可选: qwen, openai, zhipu 等
      config:
        api_key: your LLM API key
        model: qwen-plus
        # openai_base_url: https://api.openai.com/v1  # 可选，自定义服务地址
    # ========== Embedding Configuration ==========
    embedder:
      provider: openai  # 可选: qwen, openai 等
      config:
        api_key: your embedding model API key
        model: text-embedding-v4
        openai_base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
        # embedding_dims: 1024  # Vector dimension, configure if not 1536

    # ========== Database Configuration ==========
    # oceanbase (recommended, best performance), seekdb (recommended, integrated AI app storage), postgres, sqlite (lightweight alternative)
    # User profile function supports: oceanbase, seekdb, sqlite
    vector_store:
      provider: sqlite
      config: {}  # No extra configuration needed for SQLite
      # OceanBase configuration example:
      # provider: oceanbase
      # config:
      #   host: 127.0.0.1
      #   port: 2881
      #   user: root@test
      #   password: your_password
      #   db_name: powermem
      #   collection_name: memories  # Default table name, if dimension error occurs please delete or rename this table
      #   embedding_model_dims: 1024  # Embedding vector dimension, make sure it matches the model used (e.g., Zhipu embedding-2 is 1024, embedding-3 is 2048)
  nomem:
    # If you do not want to use memory, you can use nomem
    type: nomem
  mem_local_short:
    # Local memory function, summarized by selected_module.llm, data is stored on the local server and will not be uploaded externally
    type: mem_local_short
    # Equipped with an independent LLM for memory storage
    # If not filled in here, selected_module.LLM will be used as the memory storage LLM by default
    # If you do not want to use selected_module.LLM for memory storage, it is best to use an independent LLM here, such as the free ChatGLMLLM
    llm: ChatGLMLLM

ASR:
  FunASR:
    type: fun_local
    model_dir: models/SenseVoiceSmall
    output_dir: tmp/
  AudioPassthru:
    type: audio_passthru
    output_dir: tmp/
  FunASRServer:
    # Deploy FunASR independently and use FunASR's API service in five steps:
    # 1. mkdir -p ./funasr-runtime-resources/models
    # 2. sudo docker run -p 10096:10095 -it --privileged=true -v $PWD/funasr-runtime-resources/models:/workspace/models registry.cn-hangzhou.aliyuncs.com/funasr_repo/funasr:funasr-runtime-sdk-online-cpu-0.1.12
    # After the above, enter the container and continue with step 3: cd FunASR/runtime
    # Do not exit the container, continue with step 4: nohup bash run_server_2pass.sh --download-model-dir /workspace/models --vad-dir damo/speech_fsmn_vad_zh-cn-16k-common-onnx --model-dir iic/SenseVoiceSmall-onnx  --online-model-dir damo/speech_paraformer-large_asr_nat-zh-cn-16k-common-vocab8404-online-onnx  --punc-dir damo/punc_ct-transformer_zh-cn-common-vad_realtime-vocab272727-onnx --lm-dir damo/speech_ngram_lm_zh-cn-ai-wesp-fst --itn-dir thuduj12/fst_itn_zh --hotword /workspace/models/hotwords.txt > log.txt 2>&1 &
    # After the above, continue with step 5: tail -f log.txt
    # After step 5, you will see the model download log. Once downloaded, you can connect and use it.
    # The above is for CPU inference. For GPU, see: https://github.com/modelscope/FunASR/blob/main/runtime/docs/SDK_advanced_guide_online_zh.md
    type: fun_server
    host: 127.0.0.1
    port: 10096
    is_ssl: true
    api_key: none
    output_dir: tmp/
  SherpaASR:
    # Sherpa-ONNX local speech recognition (manual model download required)
    type: sherpa_onnx_local
    model_dir: models/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17
    output_dir: tmp/
    # Model type: sense_voice (multilingual) or paraformer (Chinese only)
    model_type: sense_voice
  SherpaParaformerASR:
    # Chinese speech recognition model, can run on low-performance devices (manual model download required, e.g., RK3566-2g)
    # For detailed configuration, see: docs/sherpa-paraformer-guide.md
    type: sherpa_onnx_local
    model_dir: models/sherpa-onnx-paraformer-zh-small-2024-03-09
    output_dir: tmp/
    model_type: paraformer
  DoubaoASR:
    # You can apply for related keys and information here
    # https://console.volcengine.com/speech/app
    # The difference between DoubaoASR and DoubaoStreamASR: DoubaoASR is charged per use, DoubaoStreamASR is charged by time
    # Generally, per-use charging is cheaper, but DoubaoStreamASR uses large model technology and has better performance
    type: doubao
    appid: your Volcano Engine speech synthesis service appid
    access_token: your Volcano Engine speech synthesis service access_token
    cluster: volcengine_input_common
    # Hotword and replacement word usage: https://www.volcengine.com/docs/6561/155738
    boosting_table_name: (optional) your hotword file name
    correct_table_name: (optional) your replacement word file name
    output_dir: tmp/
  DoubaoStreamASR:
    # You can apply for related keys and information here
    # https://console.volcengine.com/speech/app
    # The difference between DoubaoASR and DoubaoStreamASR: DoubaoASR is charged per use, DoubaoStreamASR is charged by time
    # Activation address: https://console.volcengine.com/speech/service/10011
    # Generally, per-use charging is cheaper, but DoubaoStreamASR uses large model technology and has better performance
    type: doubao_stream
    appid: your Volcano Engine speech synthesis service appid
    access_token: your Volcano Engine speech synthesis service access_token
    # Resource ID: hourly version volc.bigasr.sauc.duration, concurrent version volc.bigasr.sauc.concurrent
    resource_id: volc.bigasr.sauc.duration
    # Hotword and replacement word usage: https://www.volcengine.com/docs/6561/155738
    boosting_table_name: (optional) your hotword file name
    correct_table_name: (optional) your replacement word file name
    # Enable multilingual recognition mode
    enable_multilingual: False
    # When this key is empty, the model supports recognition of Chinese, English, Shanghainese, Minnan, Sichuan, Shaanxi, and Cantonese. When set to a specific key, it can recognize the specified language.
    # For a detailed language list, see https://www.volcengine.com/docs/6561/1354869
    # language: zh-cn
    # Silence detection duration (ms), default is 200ms
    end_window_size: 200
    output_dir: tmp/
  DoubaoStreamASRV2:
    # Doubao ASR model 2.0 (based on Volcano Engine seed-asr)
    # Activation address: https://console.volcengine.com/speech/service/10038
    # Cheaper, recommended for high concurrency scenarios
    type: doubao_stream
    appid: your Volcano Engine speech synthesis service appid
    access_token: your Volcano Engine speech synthesis service access_token
    # Resource ID: hourly version volc.seedasr.sauc.duration, concurrent version volc.seedasr.sauc.concurrent
    resource_id: volc.seedasr.sauc.duration
    # Hotword and replacement word usage: https://www.volcengine.com/docs/6561/155738
    boosting_table_name: (optional) your hotword file name
    correct_table_name: (optional) your replacement word file name
    # Enable multilingual recognition mode
    enable_multilingual: False
    # When this key is empty, the model supports recognition of Chinese, English, Shanghainese, Minnan, Sichuan, Shaanxi, and Cantonese. When set to a specific key, it can recognize the specified language.
    # For a detailed language list, see https://www.volcengine.com/docs/6561/1354869
    # language: zh-cn
    # Silence detection duration (ms), default is 200ms
    end_window_size: 200
    output_dir: tmp/
  TencentASR:
    # Token application address: https://console.cloud.tencent.com/cam/capi
    # Free resources: https://console.cloud.tencent.com/asr/resourcebundle
    type: tencent
    appid: your Tencent speech synthesis service appid
    secret_id: your Tencent speech synthesis service secret_id
    secret_key: your Tencent speech synthesis service secret_key
    output_dir: tmp/
  AliyunASR:
    # Alibaba Cloud Intelligent Speech Interaction Service. You need to activate the service on Alibaba Cloud and obtain verification information.
    # HTTP POST request, processes the entire audio at once
    # Platform address: https://nls-portal.console.aliyun.com/
    # Appkey address: https://nls-portal.console.aliyun.com/applist
    # Token address: https://nls-portal.console.aliyun.com/overview
    # Difference between AliyunASR and AliyunStreamASR: AliyunASR is for batch processing, AliyunStreamASR is for real-time interaction
    # Generally, non-streaming ASR is cheaper (0.004 RMB/sec, ¥0.24/min)
    # But AliyunStreamASR has better real-time performance (0.005 RMB/sec, ¥0.3/min)
    # Define ASR API type
    type: aliyun
    appkey: your Alibaba Cloud Intelligent Speech Interaction Service Appkey
    token: your Alibaba Cloud Intelligent Speech Interaction Service AccessToken (temporary, 24 hours; for long-term use, use access_key_id and access_key_secret below)
    access_key_id: your Alibaba Cloud account access_key_id
    access_key_secret: your Alibaba Cloud account access_key_secret
    output_dir: tmp/
  AliyunStreamASR:
    # Alibaba Cloud Intelligent Speech Interaction Service - Real-time streaming speech recognition
    # WebSocket connection, real-time audio stream processing
    # Platform address: https://nls-portal.console.aliyun.com/
    # Appkey address: https://nls-portal.console.aliyun.com/applist
    # Token address: https://nls-portal.console.aliyun.com/overview
    # Difference between AliyunASR and AliyunStreamASR: AliyunASR is for batch processing, AliyunStreamASR is for real-time interaction
    # Generally, non-streaming ASR is cheaper (0.004 RMB/sec, ¥0.24/min)
    # But AliyunStreamASR has better real-time performance (0.005 RMB/sec, ¥0.3/min)
    # Define ASR API type
    type: aliyun_stream
    appkey: your Alibaba Cloud Intelligent Speech Interaction Service Appkey
    token: your Alibaba Cloud Intelligent Speech Interaction Service AccessToken (temporary, 24 hours; for long-term use, use access_key_id and access_key_secret below)
    access_key_id: your Alibaba Cloud account access_key_id
    access_key_secret: your Alibaba Cloud account access_key_secret
    # Server region selection, choose a closer server to reduce latency, e.g., nls-gateway-cn-hangzhou.aliyuncs.com (Hangzhou)
    host: nls-gateway-cn-shanghai.aliyuncs.com
    # Sentence break detection time (ms), controls how long of silence triggers a break, default is 800ms
    max_sentence_silence: 800
    output_dir: tmp/
  BaiduASR:
    # Get AppID, API Key, Secret Key: https://console.bce.baidu.com/ai-engine/old/#/ai/speech/app/list
    # View resource quota: https://console.bce.baidu.com/ai-engine/old/#/ai/speech/overview/resource/list
    type: baidu
    app_id: your Baidu Speech Technology AppID
    api_key: your Baidu Speech Technology APIKey
    secret_key: your Baidu Speech Technology SecretKey
    # Language parameter, 1537 is Mandarin. See: https://ai.baidu.com/ai-doc/SPEECH/0lbxfnc9b
    dev_pid: 1537
    output_dir: tmp/
  OpenaiASR:
    # OpenAI speech recognition service. You need to create an organization and get an api_key on the OpenAI platform first.
    # Supports multiple languages including Chinese, English, Japanese, Korean, etc. See: https://platform.openai.com/docs/guides/speech-to-text
    # Requires internet connection
    # Application steps:
    # 1. Log in to OpenAI Platform: https://auth.openai.com/log-in
    # 2. Create api-key: https://platform.openai.com/settings/organization/api-keys
    # 3. Model can be gpt-4o-transcribe or GPT-4o mini Transcribe
    type: openai
    api_key: your OpenAI API key
    base_url: https://api.openai.com/v1/audio/transcriptions
    model_name: gpt-4o-mini-transcribe
    output_dir: tmp/
  GroqASR:
    # Groq speech recognition service. You need to create an API key in the Groq Console first.
    # Application steps:
    # 1. Log in to Groq Console: https://console.groq.com/home
    # 2. Create api-key: https://console.groq.com/keys
    # 3. Model can be whisper-large-v3-turbo or whisper-large-v3 (distil-whisper-large-v3-en supports only English transcription)
    type: openai
    api_key: your Groq API key
    base_url: https://api.groq.com/openai/v1/audio/transcriptions
    model_name: whisper-large-v3-turbo
    output_dir: tmp/
  VoskASR:
    # Official website: https://alphacephei.com/vosk/
    # Configuration instructions:
    # 1. VOSK is an offline speech recognition library supporting multiple languages
    # 2. You need to download the model file first: https://alphacephei.com/vosk/models
    # 3. For Chinese, recommended models: vosk-model-small-cn-0.22 or vosk-model-cn-0.22
    # 4. Runs completely offline, no internet connection required
    # 5. Output files are saved in the tmp/ directory
    # Usage steps:
    # 1. Visit https://alphacephei.com/vosk/models to download the appropriate model
    # 2. Extract the model file to the models/vosk/ folder in your project
    # 3. Specify the correct model path in the configuration
    # 4. Note: VOSK Chinese models output without punctuation, and words are separated by spaces
    type: vosk
    model_path: "your model path, e.g.: models/vosk/vosk-model-small-cn-0.22"
    output_dir: tmp/
  Qwen3ASRFlash:
    # Qwen3-ASR-Flash speech recognition service (Tongyi Qianwen), requires creating an API key on Alibaba Cloud Bailian platform first
    # Application steps:
    # 1. Log in to Alibaba Cloud Bailian platform: https://bailian.console.aliyun.com/
    # 2. Create API-KEY: https://bailian.console.aliyun.com/#/api-key
    # 3. Qwen3-ASR-Flash is based on the Tongyi Qianwen multimodal base, supports multilingual recognition, singing recognition, noise rejection, etc.
    type: qwen3_asr_flash
    api_key: your Alibaba Cloud Bailian API key
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    model_name: qwen3-asr-flash
    output_dir: tmp/
    # ASR option configuration
    enable_lid: true  # Automatic language detection
    enable_itn: true  # Inverse text normalization
    #language: "zh"  # Language, supports zh, en, ja, ko, etc.
    context: ""  # Context information, used to improve recognition accuracy, no more than 10,000 tokens
  XunfeiStreamASR:
    # iFlytek streaming speech recognition service
    # You need to create an application on the iFlytek Open Platform and obtain the following credentials
    # iFlytek Open Platform: https://www.xfyun.cn/
    # After creating the application, get the following from "My Applications":
    # - APPID
    # - APISecret
    # - APIKey
    type: xunfei_stream
    # Required parameters - iFlytek Open Platform application info
    app_id: your APPID
    api_key: your APIKey
    api_secret: your APISecret
    # Recognition parameter configuration
    domain: slm # Recognition domain, iat: daily conversation, medical: medical, finance: finance, etc.
    language: zh_cn # Language, zh_cn: Chinese, en_us: English
    accent: mandarin # Accent, mandarin: Mandarin
    # Adjust audio processing parameters to improve long speech recognition quality
    output_dir: tmp/
  AliyunBLStreamASR:
    # Alibaba Bailian Paraformer real-time speech recognition service
    # WebSocket real-time streaming speech recognition, supports multilingual, hotword customization, semantic segmentation, and other advanced features
    # Platform: https://bailian.console.aliyun.com/
    # API Key: https://bailian.console.aliyun.com/#/api-key
    # Documentation: https://help.aliyun.com/zh/model-studio/websocket-for-paraformer-real-time-service
    # Supported models: paraformer-realtime-v2 (recommended), paraformer-realtime-8k-v2, paraformer-realtime-v1, paraformer-realtime-8k-v1
    type: aliyunbl_stream
    # Required parameters
    api_key: your Alibaba Bailian API key
    # Model selection, v2 version recommended
    model: paraformer-realtime-v2
    # Audio format and sample rate
    format: pcm
    sample_rate: 16000  # v2 supports any sample rate, v1 only supports 16000, 8k version only supports 8000
    # Optional parameters
    disfluency_removal_enabled: false  # Whether to filter filler words (e.g., "um", "ah", etc.)
    semantic_punctuation_enabled: false  # Semantic segmentation (true: meeting scenario, accurate; false: VAD segmentation, interactive scenario, low latency)
    max_sentence_silence: 200  # VAD segmentation silence duration threshold (ms), range 200-6000, only effective for VAD segmentation
    multi_threshold_mode_enabled: false  # Prevents VAD segmentation from being too long, only effective for VAD segmentation
    punctuation_prediction_enabled: true  # Whether to automatically add punctuation
    inverse_text_normalization_enabled: true  # Whether to enable ITN (Chinese numbers to Arabic numerals)
    # Hotword customization documentation: https://help.aliyun.com/zh/model-studio/custom-hot-words?
    # vocabulary_id: vocab-xxx-24ee19fa8cfb4d52902170a0xxxxxxxx  # Hotword ID (optional)
    # language_hints: ["zh", "en"]  # Specify language (optional), supports zh, en, ja, yue, ko, de, fr, ru
    output_dir: tmp/  
